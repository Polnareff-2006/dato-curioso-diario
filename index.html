<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dato Curioso Diario</title>
  <meta name="theme-color" content="#080d09">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dato Curioso">
  <meta name="application-name" content="Dato Curioso">
  <meta name="description" content="Tu píldora de conocimiento diario con estética retro pixel art y monitor CRT.">

  <!-- Enlaces al Manifiesto PWA -->
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Favicon e Iconos PWA -->
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Fuente pixelada VT323 desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <!-- Hoja de estilos que crearemos a continuación -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Decoraciones flotantes laterales -->
  <div class="decoracion-pixel deco-izq">
    <span class="pixel-estrella">★</span>
    <span class="pixel-cruz">+</span>
    <span class="pixel-corazon">♥</span>
    <span class="pixel-hoja">☘</span>
    <span class="pixel-cruz-chica">+</span>
    <span class="pixel-corazon-chico">♥</span>
  </div>

  <!-- Tarjeta principal del monitor -->
  <main id="tarjeta-dato" class="tema-biologia">
    <header>
      <div class="fila-superior">
        <div class="fila-izq">
          <span class="etiqueta-categoria">🌿 Biología</span>
          <span id="badge-conexion" class="badge-conexion offline-oculto">⚡ MODO OFFLINE</span>
        </div>
        <div class="acciones-superiores">
          <!-- Botón de instalación PWA -->
          <button id="btn-instalar" class="btn-pwa-instalar" title="Instalar Aplicación" style="display: none;">[ ⇩
            INSTALAR APP ]</button>
          <!-- Botón interactivo de Favorito -->
          <button id="btn-favorito" class="btn-favorito" title="Guardar en favoritos">☆</button>
        </div>
      </div>
      <h2 id="numero-dato">DATO #268:</h2>
      <h1 id="titulo-dato">TITULO DEL DATO</h1>
    </header>

    <div class="pixel-art-caja">
      <img src="" alt="Ilustración Pixel Art" id="imagen-dato">
    </div>

    <p id="resumen-dato"></p>

    <!-- Acordeón 1: Saber más -->
    <details>
      <summary>¿Quieres saber más?</summary>
      <p id="extension-dato"></p>
    </details>

    <!-- Acordeón 2: Fuentes -->
    <details class="fuentes">
      <summary>Fuentes citadas</summary>
      <ul></ul>
    </details>

    <!-- Acordeón 3: Calendario organizado por mes -->
    <details class="historial-acordeon">
      <summary>¿Curiosidad por datos anteriores? Míralos acá</summary>

      <!-- Selector de meses horizontal -->
      <div id="selector-meses" class="barra-meses"></div>

      <!-- Cuadrícula de botones del mes activo -->
      <div id="grid-historial" class="grid-calendario"></div>
    </details>
  </main>

  <div class="decoracion-pixel deco-der">
    <span class="pixel-cruz">+</span>
    <span class="pixel-hoja">☘</span>
    <span class="pixel-corazon">♥</span>
    <span class="pixel-cruz-chica">+</span>
    <span class="pixel-estrella">★</span>
    <span class="pixel-corazon-chico">♥</span>
  </div>
  <script src="app.js"></script>
</body>

</html>

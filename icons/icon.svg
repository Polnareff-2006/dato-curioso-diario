<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Filtro de brillo retro neón -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Patrón de scanlines -->
    <pattern id="scanlines" width="100%" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="512" y2="0" stroke="#000000" stroke-width="3" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Fondo base CRT -->
  <rect width="512" height="512" rx="64" fill="#080d09" />

  <!-- Monitor CRT con resplandor neón -->
  <rect x="40" y="40" width="432" height="432" rx="28" fill="#0e1912" stroke="#4ade80" stroke-width="12" filter="url(#glow)" />

  <!-- Scanlines sobre la pantalla -->
  <rect x="46" y="46" width="420" height="420" rx="22" fill="url(#scanlines)" pointer-events="none" />

  <!-- Pixel Art Central: Signo de pregunta retro & estrella radiante -->
  <g fill="#4ade80" filter="url(#glow)">
    <!-- Marco interior de pantalla -->
    <rect x="80" y="80" width="352" height="12" fill="#22c55e" opacity="0.7" />
    <rect x="80" y="420" width="352" height="12" fill="#22c55e" opacity="0.7" />
  </g>

  <!-- Matriz de píxeles para el signo retro ? y bombilla de curiosidad -->
  <g fill="#facc15" filter="url(#glow)">
    <!-- Signo de interrogación pixelado -->
    <rect x="216" y="140" width="80" height="24" />
    <rect x="296" y="164" width="24" height="48" />
    <rect x="240" y="212" width="80" height="24" />
    <rect x="240" y="236" width="32" height="40" />
    <!-- Punto del signo -->
    <rect x="240" y="300" width="32" height="32" />
  </g>

  <!-- Chispas pixeladas de idea/curiosidad -->
  <g fill="#a7f3d0" opacity="0.9">
    <rect x="140" y="150" width="16" height="16" />
    <rect x="356" y="150" width="16" height="16" />
    <rect x="130" y="260" width="14" height="14" />
    <rect x="368" y="260" width="14" height="14" />
    <rect x="180" y="330" width="12" height="12" />
    <rect x="320" y="330" width="12" height="12" />
  </g>

  <!-- Base / Soporte CRT inferior -->
  <rect x="200" y="472" width="112" height="16" rx="4" fill="#166534" />
</svg>
